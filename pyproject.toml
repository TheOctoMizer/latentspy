[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latentspy"
version = "0.1.0"
description = "AAI-590 LatentSpy Package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "scikit-learn>=1.8.0",
    "sse-starlette>=3.3.2",
    "torch>=2.10.0",
    "transformers>=5.4.0",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
cuda = ["faiss-gpu>=1.7.2; python_version < '3.11'"]
gpu = ["faiss-gpu>=1.7.2; python_version < '3.11'"]

[project.scripts]
latentspy = "latentspy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latentspy"]
